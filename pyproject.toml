[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpm-spec-editor"
version = "0.0.5"
description = "GUI editor and analyzer for RPM spec files"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

authors = [
    { name = "xewca" }
]

dependencies = [
    "PyQt5"
]

[project.scripts]
rpm-spec-editor = "rpm_spec_editor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpm_spec_editor = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[tool.setuptools.data_files]
"share/applications" = ["packaging/rpm-spec-editor.desktop"]
"share/icons/hicolor/256x256/apps" = ["src/rpm_spec_editor/assets/rpm-spec-editor.png"]

testpaths = [
    "tests"
]

addopts = """
-v
--tb=short
--strict-markers
"""

markers = [
    "unit",
    "integration",
    "system",
    "gui"
]

qt_api = "pyqt5"
